name: Release
run-name: ${{ github.event_name == 'push' && github.ref_name || 'Test build' }}

# Push a tag like v1.2.0 to build and publish a release.
# "Run workflow" (manual) builds the same packages without publishing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build · Linux
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Release notes must exist in CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $v' section"
            exit 1
          fi
          cat release-notes.md

      - run: npm ci

      - name: Typecheck, lint and tests
        run: npm run check

      - name: Build AppImage and .deb
        env:
          GH_TOKEN: ''
        run: npm run dist -- --publish never

      - name: Checksums
        working-directory: release
        run: sha256sum *.AppImage *.deb > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: stellio-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
            release-notes.md
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 3 || 14 }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stellio-linux
          path: dist

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.AppImage
            dist/release/*.deb

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Stellio ${{ needs.build.outputs.version }}" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            dist/release/*.AppImage dist/release/*.deb dist/release/SHA256SUMS
